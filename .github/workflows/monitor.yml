name: Polymarket Trend Reversal Monitor

on:
  workflow_dispatch:
  schedule:
  - cron: "*/30 * * * *"   # Reversal 감시
  - cron: "0 0 * * *"      # 매일 UTC 00:00 = JST 09:00

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run trend reversal monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
